<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfólio de Projetos — PME</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  /* ===== TEMA ESCURO — "Sala de Controle" (padrão / tarde e noite) ===== */
  :root{
    --bg:#14120c;
    --bg-img:radial-gradient(1100px 640px at 10% -10%, #2a2416 0%, #14120c 60%);
    --bg-size:auto;
    --panel:#211d14; --line:#3a3120; --cardline:#3a3220; --chip:#2c2617;
    --track:#2a2416; --soft:#1b1810; --col-bg:#1b1810;
    --txt:#f3ecdd; --mut:#b7a988; --mut2:#8a7d61; --nx:#cabd9f;
    --accent:#f6b31d;
    --r:6px; --r-chip:3px;
    --sh:0 2px 10px rgba(0,0,0,.40);
    --disp:"Space Grotesk","Segoe UI",system-ui,sans-serif;
    --body:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --h1-font:var(--disp); --h1-transform:uppercase; --h1-mark:none; --h1-ls:.4px;
    --sub-font:var(--body);
    --headbg:linear-gradient(180deg,#211d13,rgba(20,18,12,.35));
    --headborder:1px solid var(--line);
    --topbar:3px solid var(--accent);
    --clock-col:var(--accent);
    --ic-col:var(--accent); --rot-off:#4a4230; --rot-on:var(--accent);
    --live-border:0 solid transparent;
    --av-s:40%; --av-l:58%; --av-fg:#1b160d;
    --st-andamento:#f2b01e; --st-aguardando:#e0912e; --st-piloto:#b083c9;
    --st-revisao:#6fa0c0; --st-parado:#d76a3c; --st-congelado:#9aa6b2;
    --st-concluido:#9fae5b; --st-cancelado:#c0473c;
    --ar-fin:#e0a52e; --ar-com:#d76a3c; --ar-ti:#b083c9; --ar-ope:#6fa0c0;
    --ar-fis:#cf9a4a; --ar-rh:#cf7096; --ar-nn:#7fae7a; --ar-log:#c98b5a; --ar-cpl:#9a86c4;
    --em-bg1:#2c2517; --em-bg2:#141109; --em-ring:#4a3f28;
    --em-orbit:#b6a888; --em-orbit-op:.40;
    --em-p1:#f2b01e; --em-p2:#6fa0c0; --em-p3:#c0473c; --em-p4:#9fae5b; --em-p5:#b083c9;
  }

  /* ===== TEMA CLARO — "Blueprint / Papel Técnico" (manhã) ===== */
  html[data-theme="light"]{
    --bg:#f4f3ec;
    --bg-img:linear-gradient(rgba(28,43,54,.055) 1px,transparent 1px),
             linear-gradient(90deg,rgba(28,43,54,.055) 1px,transparent 1px);
    --bg-size:30px 30px;
    --panel:#ffffff; --line:#cfcdbd; --cardline:#d9d7c7; --chip:#edebe0;
    --track:#e4e2d5; --soft:#fbfaf4; --col-bg:rgba(255,255,255,.62);
    --txt:#1c2b36; --mut:#5b6b74; --mut2:#8b9599; --nx:#3f5058;
    --accent:#f5c400;
    --r:2px; --r-chip:2px;
    --sh:0 1px 0 rgba(28,43,54,.05), 0 2px 7px rgba(28,43,54,.07);
    --disp:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    --body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
    --h1-font:var(--body); --h1-transform:none; --h1-ls:-.2px;
    --h1-mark:linear-gradient(180deg,transparent 60%,var(--accent) 60%,var(--accent) 93%,transparent 93%);
    --sub-font:var(--disp);
    --headbg:rgba(255,255,255,.82);
    --headborder:2px solid var(--txt);
    --topbar:0 solid transparent;
    --clock-col:var(--txt);
    --ic-col:var(--txt); --rot-off:#c5c3b3; --rot-on:var(--txt);
    --live-border:1px solid #c9a300;
    --av-s:32%; --av-l:42%; --av-fg:#ffffff;
    --st-andamento:#c8860d; --st-aguardando:#b5651d; --st-piloto:#6b4ea8;
    --st-revisao:#2d6a8f; --st-parado:#c2461f; --st-congelado:#7a8790;
    --st-concluido:#4a7c2f; --st-cancelado:#9e2b25;
    --ar-fin:#b07d10; --ar-com:#c2461f; --ar-ti:#6b4ea8; --ar-ope:#2d6a8f;
    --ar-fis:#8a6a1f; --ar-rh:#a53d6b; --ar-nn:#3f7a52; --ar-log:#a35a22; --ar-cpl:#5d4a94;
    --em-bg1:#ffffff; --em-bg2:#e7e5d8; --em-ring:#adab99;
    --em-orbit:#5b6b74; --em-orbit-op:.50;
    --em-p1:#c8860d; --em-p2:#2d6a8f; --em-p3:#9e2b25; --em-p4:#4a7c2f; --em-p5:#6b4ea8;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background-color:var(--bg); background-image:var(--bg-img);
    background-size:var(--bg-size); background-attachment:fixed;
    color:var(--txt); font-family:var(--body);
    overflow:hidden; height:100vh; display:flex; flex-direction:column;
    transition:background-color .6s ease, color .6s ease;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:15px 30px; background:var(--headbg);
    border-top:var(--topbar); border-bottom:var(--headborder);
  }
  .brand{display:flex;align-items:center;gap:15px}
  .logo{width:58px;height:58px;flex:none}
  .logo svg{width:100%;height:100%;display:block}
  .logo .e1{stop-color:var(--em-bg1)} .logo .e2{stop-color:var(--em-bg2)}
  .logo .ering{stroke:var(--em-ring);stroke-width:1.5}
  .logo .eorbit{stroke:var(--em-orbit);stroke-opacity:var(--em-orbit-op);stroke-width:1.6}
  .logo .ep1{fill:var(--em-p1)} .logo .ep2{fill:var(--em-p2)} .logo .ep3{fill:var(--em-p3)}
  .logo .ep4{fill:var(--em-p4)} .logo .ep5{fill:var(--em-p5)}
  h1{font-family:var(--h1-font);font-size:27px;font-weight:700;letter-spacing:var(--h1-ls);
     color:var(--txt);text-transform:var(--h1-transform);display:inline;background:var(--h1-mark)}
  .sub{font-family:var(--sub-font);font-size:13px;color:var(--mut);margin-top:7px}
  .clock{text-align:right}
  .clock .time{font-family:var(--disp);font-size:38px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;color:var(--clock-col)}
  .clock .date{font-size:14px;color:var(--mut);margin-top:5px}
  .live{font-family:var(--disp);display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut2);margin-top:5px}
  .dot-live{width:9px;height:9px;border-radius:50%;background:var(--accent);border:var(--live-border);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(246,179,29,.45)}70%{box-shadow:0 0 0 9px rgba(246,179,29,0)}100%{box-shadow:0 0 0 0 rgba(246,179,29,0)}}

  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:15px;padding:18px 30px 6px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px 17px 14px;position:relative;overflow:hidden;box-shadow:var(--sh)}
  .kpi .n{font-family:var(--disp);font-size:51px;font-weight:600;line-height:.95;font-variant-numeric:tabular-nums;color:var(--txt)}
  .kpi .l{font-family:var(--disp);font-size:12.5px;color:var(--mut);margin-top:9px;font-weight:600;letter-spacing:.7px;text-transform:uppercase}
  .kpi .bar{position:absolute;left:0;right:0;top:0;height:4px}
  .kpi .sec{font-size:12px;color:var(--mut2);margin-top:5px}

  main{flex:1;min-height:0;padding:12px 30px 16px;display:flex;flex-direction:column}
  .viewhead{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 12px}
  .viewtitle{font-family:var(--disp);font-size:17.5px;font-weight:600;color:var(--txt);display:flex;align-items:center;gap:11px;text-transform:uppercase;letter-spacing:.7px}
  .viewtitle .ic{font-size:20px;color:var(--ic-col)}
  .rot{display:flex;gap:8px;align-items:center}
  .rot .rdot{width:10px;height:10px;border-radius:50%;background:var(--rot-off);cursor:pointer;transition:.3s}
  .rot .rdot.on{background:var(--rot-on);width:30px;border-radius:var(--r-chip)}
  .view{flex:1;min-height:0;display:none}
  .view.on{display:flex;flex-direction:column;min-height:0}

  .board{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;flex:1;min-height:0}
  .col{background:var(--col-bg);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .colhead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
  .colhead .cn{font-family:var(--disp);display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:var(--txt);text-transform:uppercase;letter-spacing:.3px}
  .colhead .cd{width:11px;height:11px;border-radius:2px}
  .colhead .cc{font-family:var(--disp);font-size:13.5px;font-weight:600;background:var(--chip);border:1px solid var(--cardline);padding:1px 10px;border-radius:var(--r-chip);color:var(--txt)}
  .collist{overflow:hidden;flex:1;padding:8px;min-height:0}
  .collist .inner{display:flex;flex-direction:column;gap:8px}
  .card{background:var(--panel);border:1px solid var(--cardline);border-left-width:4px;border-radius:var(--r-chip);padding:11px 12px;box-shadow:var(--sh)}
  .card .ct{font-size:15.5px;font-weight:600;line-height:1.25;margin-bottom:8px;color:var(--txt)}
  .card .meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .tag{font-family:var(--disp);font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:var(--r-chip);background:var(--chip);color:var(--mut);letter-spacing:.2px}
  .card .who{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut);margin-bottom:7px}
  .av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--av-fg)}
  .card .nx{font-size:13px;color:var(--nx);line-height:1.35;border-top:1px dashed var(--cardline);padding-top:7px}
  .card .nx b{font-family:var(--disp);font-size:11.5px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.3px}

  .areas{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:1;min-height:0;overflow:hidden;align-content:start}
  .acard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;display:flex;flex-direction:column;gap:11px;box-shadow:var(--sh)}
  .acard .ah{display:flex;align-items:center;justify-content:space-between}
  .acard .an{font-family:var(--disp);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.45px}
  .acard .atot{font-family:var(--disp);font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--txt)}
  .acard .stack{display:flex;height:14px;border-radius:var(--r-chip);overflow:hidden;background:var(--track)}
  .acard .stack span{height:100%}
  .acard .leg{display:flex;flex-wrap:wrap;gap:7px 14px}
  .acard .leg .li{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut)}
  .acard .leg .li i{width:9px;height:9px;border-radius:2px;display:inline-block}
  .acard .leg .li b{font-family:var(--disp);color:var(--txt);font-weight:600}

  .exec{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;flex:1;min-height:0}
  .execbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;display:flex;flex-direction:column;min-height:0;box-shadow:var(--sh)}
  .execbox h3{font-family:var(--disp);font-size:14px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);margin-bottom:11px;display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--cardline)}
  .attlist{overflow:hidden;flex:1}
  .attlist .inner{display:flex;flex-direction:column;gap:9px}
  .att{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border:1px solid var(--cardline);border-radius:var(--r-chip);padding:10px 12px}
  .att .pill{font-family:var(--disp);flex:none;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:var(--r-chip);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
  .att .body .t{font-size:15.5px;font-weight:600;line-height:1.2;color:var(--txt)}
  .att .body .n{font-size:13px;color:var(--nx);margin-top:4px;line-height:1.3}
  .att .body .r{font-family:var(--disp);font-size:11.5px;color:var(--mut);margin-top:5px}
  .bigrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .bigrow .b{background:var(--soft);border:1px solid var(--cardline);border-radius:var(--r-chip);padding:13px 15px;position:relative;overflow:hidden}
  .bigrow .b .n{font-family:var(--disp);font-size:41px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--txt)}
  .bigrow .b .l{font-size:13px;color:var(--mut);margin-top:4px;font-weight:500}
  .bigrow .b .bar{position:absolute;left:0;top:0;bottom:0;width:5px}
  .distrow{display:flex;flex-direction:column;gap:11px;margin-top:2px}
  .distrow .d{display:grid;grid-template-columns:185px 1fr 40px;align-items:center;gap:12px}
  .distrow .d .dl{font-family:var(--disp);font-size:12.5px;color:var(--mut);font-weight:500}
  .distrow .d .dt{height:16px;border-radius:var(--r-chip);background:var(--track);overflow:hidden}
  .distrow .d .dt i{display:block;height:100%;border-radius:var(--r-chip)}
  .distrow .d .dv{font-family:var(--disp);font-size:15px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  footer{font-family:var(--disp);padding:7px 30px 10px;color:var(--mut2);font-size:11.5px;display:flex;justify-content:space-between}
  .scrollmask{position:relative}
</style>
<script>
  /* ==== TROCA AUTOMÁTICA DE TEMA POR HORÁRIO ====
     Claro ("Blueprint") das 06h às 11h59 · Escuro ("Sala de Controle") das 12h às 05h59.
     Para mudar, altere os dois números abaixo. */
  const HORA_CLARO = 6;
  const HORA_ESCURO = 12;
  let temaManual = null;
  function temaDoRelogio(){
    const hr = new Date().getHours();
    return (hr >= HORA_CLARO && hr < HORA_ESCURO) ? "light" : "dark";
  }
  function aplicarTema(){
    const t = temaManual || temaDoRelogio();
    if(document.documentElement.dataset.theme !== t) document.documentElement.dataset.theme = t;
  }
  aplicarTema();
  setInterval(aplicarTema, 60000);
  /* tecla T = alterna manualmente (para testar na TV); volta ao automático ao recarregar */
  window.addEventListener("keydown", e=>{
    if(e.key==="t"||e.key==="T"){
      temaManual = (document.documentElement.dataset.theme==="light") ? "dark" : "light";
      aplicarTema();
    }
  });
</script>
</head>

  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

          <radialGradient id="hbg" cx="42%" cy="35%" r="75%"><stop class="e1" offset="0%"/><stop class="e2" offset="100%"/></radialGradient>

        <circle cx="50" cy="50" r="49" fill="url(#hbg)" class="ering"/>

      <h1>Portfólio de Projetos — PME</h1>

  </div>
  <div class="clock">

</header>

<div class="kpis" id="kpis"></div>

<main>
  <div class="viewhead">
    <div class="viewtitle"><span class="ic" id="vic">▦</span><span id="vtitle">Kanban por Status</span></div>
    <div class="rot" id="rot"></div>

  <section class="view on" id="v0"><div class="board" id="board"></div></section>

    <div class="exec">

        <h3>⚠ Precisa de atenção — Aguardando validação, Parados & Congelados</h3>

      </div>
    </div>

</main>

<footer>
  <span>PME Máquinas · Setor de Sincronismo Organizacional</span>
  <span id="total">—</span>
</footer>

"],"ano":"2025","r":"Julio Zanella","nx":"Validação da gerência e expansão para todos os vendedores."},{"n":"Sincronismo Organizacional PME","s":"Cancelado","a":["Operações"],"ano":"2026","r":"Raphael Cezar","nx":"Apresentar a defesa ao Leonardo e institucionalizar a governança do portfólio."},{"n":"Solução de CRM + Chat Omnichannel","s":"Em andamento","a":["Comercial","TI / Automação"],"ano":"2026","r":"Pedro Metzker","nx":"Enviar o RFP a fornecedores e comparar as propostas."},{"n":"Telefonia Móvel Corporativa (WhatsApp e Voz)","s":"Cancelado","a":["TI / Automação","Operações"],"ano":"2026","r":"Raphael Cezar","nx":"Enviar o RFP às operadoras e comparar os orçamentos."},{"n":"Transição Senior","s":"Concluído","a":["RH"],"ano":"2024","r":"Raphael Cezar","nx":"—"},{"n":"Valores Agregados","s":"Concluído","a":["Comercial","Financeiro"],"ano":"2025","r":"Raphael Cezar","nx":"Agendar uma reunião de revisão"}];

const STATUS = {
  "Em andamento":{c:"var(--st-andamento)"},
  "Aguardando validação":{c:"var(--st-aguardando)"},
  "Fase piloto":{c:"var(--st-piloto)"},
  "Implantado — revisão necessária":{c:"var(--st-revisao)",short:"Implantado (revisão)"},
  "Parado":{c:"var(--st-parado)"},
  "Congelado":{c:"var(--st-congelado)"},
  "Concluído":{c:"var(--st-concluido)"},
  "Cancelado":{c:"var(--st-cancelado)"}
};
const KANBAN_ORDER = ["Em andamento","Aguardando validação","Fase piloto","Implantado — revisão necessária","Parado","Congelado"];
const AREA_COLORS = {"Financeiro":"var(--ar-fin)","Comercial":"var(--ar-com)","TI / Automação":"var(--ar-ti)","Operações":"var(--ar-ope)","Fiscal":"var(--ar-fis)","RH":"var(--ar-rh)","Novos negócios":"var(--ar-nn)","Logística":"var(--ar-log)","Compliance":"var(--ar-cpl)"};
const ATT = ["Aguardando validação","Parado","Congelado"];
const ATT_LABEL = {"Aguardando validação":"Validar","Parado":"Parado","Congelado":"Congelado"};

const $=s=>document.querySelector(s);
const count=s=>RAW.filter(p=>p.s===s).length;
const initials=n=>n.split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const avColor=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} var(--av-s) var(--av-l))`;};
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

/* KPIs */
function renderKPIs(){
  const total=RAW.length;
  const atencao=count("Parado")+count("Congelado");
  const tiles=[
    {n:total,l:"Projetos totais",c:"var(--accent)",sec:"inclui piloto (1) e cancelados (3)"},
    {n:count("Em andamento"),l:"Em andamento",c:STATUS["Em andamento"].c},
    {n:count("Aguardando validação"),l:"Aguardando validação",c:STATUS["Aguardando validação"].c},
    {n:atencao,l:"Parados / Congelados",c:STATUS["Parado"].c,sec:count("Parado")+" parados · "+count("Congelado")+" congelados"},
    {n:count("Implantado — revisão necessária"),l:"Implantado · revisão",c:STATUS["Implantado — revisão necessária"].c},
    {n:count("Concluído"),l:"Concluídos",c:STATUS["Concluído"].c}
  ];
  $("#kpis").innerHTML=tiles.map(t=>`<div class="kpi"><span class="bar" style="background:${t.c}"></span><div class="n">${t.n}</div><div class="l">${t.l}</div>${t.sec?`<div class="sec">${t.sec}</div>`:""}</div>`).join("");
}

/* Kanban */
function renderBoard(){
  $("#board").innerHTML=KANBAN_ORDER.map(st=>{
    const col=RAW.filter(p=>p.s===st);
    const c=STATUS[st].c, label=STATUS[st].short||st;
    const cards=col.map(p=>`
      <div class="card" style="border-left-color:${c}">
        <div class="ct">${esc(p.n)}</div>
        <div class="meta">${p.a.map(a=>`<span class="tag" style="color:${AREA_COLORS[a]||'var(--mut)'}">${esc(a)}</span>`).join("")}<span class="tag">${p.ano}</span></div>
        <div class="who"><span class="av" style="background:${avColor(p.r)}">${initials(p.r)}</span>${esc(p.r)}</div>
        ${p.nx&&p.nx!=="—"?`<div class="nx"><b>Próximo:</b> ${esc(p.nx)}</div>`:""}
      </div>`).join("");
    return `<div class="col">
      <div class="colhead" style="background:linear-gradient(180deg,color-mix(in srgb, ${c} 15%, transparent),transparent)">
        <div class="cn"><span class="cd" style="background:${c}"></span>${esc(label)}</div>
        <div class="cc">${col.length}</div>
      </div>
      <div class="collist"><div class="inner">${cards||'<div class="nx" style="color:var(--mut2);padding:6px">—</div>'}</div></div>
    </div>`;
  }).join("");
  setupAutoScroll();
}

/* Áreas */
function renderAreas(){
  const areas={};
  RAW.forEach(p=>p.a.forEach(a=>{(areas[a]=areas[a]||[]).push(p);}));
  const order=Object.keys(areas).sort((x,y)=>areas[y].length-areas[x].length);
  $("#areasgrid").innerHTML=order.map(a=>{
    const list=areas[a], tot=list.length;
    const byS={};list.forEach(p=>byS[p.s]=(byS[p.s]||0)+1);
    const segs=Object.keys(STATUS).filter(s=>byS[s]>0).map(s=>`<span style="background:${STATUS[s].c};width:${byS[s]/tot*100}%" title="${s}: ${byS[s]}"></span>`).join("");
    const leg=Object.keys(STATUS).filter(s=>byS[s]>0).map(s=>`<span class="li"><i style="background:${STATUS[s].c}"></i>${STATUS[s].short||s} <b>${byS[s]}</b></span>`).join("");
    return `<div class="acard">
      <div class="ah"><div class="an" style="color:${AREA_COLORS[a]||'var(--txt)'}">${esc(a)}</div><div class="atot">${tot}</div></div>
      <div class="stack">${segs}</div>
      <div class="leg">${leg}</div>
    </div>`;
  }).join("");
}

/* Resumo executivo */
function renderExec(){
  const att=RAW.filter(p=>ATT.includes(p.s)).sort((a,b)=>ATT.indexOf(a.s)-ATT.indexOf(b.s));
  $("#attinner").innerHTML=att.map(p=>{
    const c=STATUS[p.s].c;
    return `<div class="att">
      <span class="pill" style="background:color-mix(in srgb, ${c} 15%, transparent);color:${c};border:1px solid color-mix(in srgb, ${c} 45%, transparent)">${ATT_LABEL[p.s]}</span>
      <div class="body"><div class="t">${esc(p.n)}</div>
      ${p.nx&&p.nx!=="—"?`<div class="n">${esc(p.nx)}</div>`:""}
      <div class="r">${esc(p.r)} · ${p.a.join(" / ")}</div></div>
    </div>`;
  }).join("");

  const ativos=count("Em andamento")+count("Fase piloto");
  const revisao=count("Implantado — revisão necessária");
  const big=[
    {n:ativos,l:"Ativos (andamento + piloto)",c:STATUS["Em andamento"].c},
    {n:count("Aguardando validação"),l:"Aguardando decisão",c:STATUS["Aguardando validação"].c},
    {n:count("Parado")+count("Congelado"),l:"Estagnados (parados + congelados)",c:STATUS["Parado"].c},
    {n:revisao,l:"Entregues p/ revisão",c:STATUS["Implantado — revisão necessária"].c}
  ];
  $("#bigrow").innerHTML=big.map(b=>`<div class="b"><span class="bar" style="background:${b.c}"></span><div class="n">${b.n}</div><div class="l">${b.l}</div></div>`).join("");

  const max=Math.max(...Object.keys(STATUS).map(count));
  $("#distrow").innerHTML=Object.keys(STATUS).map(s=>{
    const v=count(s),c=STATUS[s].c;
    return `<div class="d"><div class="dl">${STATUS[s].short||s}</div><div class="dt"><i style="width:${v/max*100}%;background:${c}"></i></div><div class="dv" style="color:${c}">${v}</div></div>`;
  }).join("");
}

/* Auto-scroll das colunas longas */
let scrollTimers=[];
function setupAutoScroll(){
  scrollTimers.forEach(t=>clearInterval(t));scrollTimers=[];
  document.querySelectorAll(".collist, .attlist").forEach(el=>{
    const inner=el.firstElementChild;
    if(inner.scrollHeight-el.clientHeight<20)return;
    let dir=1,pos=0;
    const t=setInterval(()=>{
      const maxS=inner.scrollHeight-el.clientHeight;
      pos+=dir*0.5;
      if(pos>=maxS){pos=maxS;dir=-1;}else if(pos<=0){pos=0;dir=1;}
      el.scrollTop=pos;
    },40);
    scrollTimers.push(t);
  });
}

/* Rotação de views */
const VIEWS=[
  {t:"Kanban por Status",ic:"▦"},
  {t:"Visão por Área",ic:"◫"},
  {t:"Resumo Executivo",ic:"◎"}
];
let cur=0,paused=false;
function showView(i){
  cur=(i+VIEWS.length)%VIEWS.length;
  document.querySelectorAll(".view").forEach((v,k)=>v.classList.toggle("on",k===cur));
  $("#vtitle").textContent=VIEWS[cur].t;$("#vic").textContent=VIEWS[cur].ic;
  document.querySelectorAll(".rot .rdot").forEach((d,k)=>d.classList.toggle("on",k===cur));
  setupAutoScroll();
}
function buildRot(){
  $("#rot").innerHTML=VIEWS.map((_,i)=>`<span class="rdot ${i===0?'on':''}" data-i="${i}"></span>`).join("");
  document.querySelectorAll(".rot .rdot").forEach(d=>d.onclick=()=>{showView(+d.dataset.i);resetTimer();});
}
let rotTimer;
function resetTimer(){clearInterval(rotTimer);rotTimer=setInterval(()=>{if(!paused)showView(cur+1);},22000);}
document.body.onmouseenter=()=>paused=true;
document.body.onmouseleave=()=>paused=false;

/* Relógio */
function tick(){
  const d=new Date();
  $("#clk").textContent=d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  $("#dt").textContent=d.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
}

/* Init */
$("#snap").textContent=SNAPSHOT;
$("#total").textContent=RAW.length+" projetos monitorados";
renderKPIs();renderBoard();renderAreas();renderExec();buildRot();
tick();setInterval(tick,1000);resetTimer();

/* Recarrega a página a cada 30 min para puxar a versão atualizada do painel */
setTimeout(()=>location.reload(),30*60*1000);
</script>
