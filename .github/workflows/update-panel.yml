name: Atualizar Painel de Projetos
on:
  schedule:
    - cron: '0 10,16 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar o painel
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          GEN=$(find . -name generate.py -not -path '*/.git/*' | head -1)
          echo "Gerador encontrado em: $GEN"
          cd "$(dirname "$GEN")"
          OUTPUT_FILE="$GITHUB_WORKSPACE/index.html" python generate.py
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Atualizacao automatica do painel"
          git push
